<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SAR Project Pipeline Output</title>
    <!-- Load an unzip utility directly via web CDN -->
    <script src="https://cloudflare.com"></script>
</head>
<body style="margin:0; padding:0; background:#f4f4f9; font-family:sans-serif;">
    <div id="loading" style="text-align:center; margin-top:100px; font-size:20px; color:#555;">
        ⏳ Decompressing heavy SAR pipeline visualization... Please wait...
    </div>
    <div id="content"></div>

    <script>
        // Fetch the compressed file from your GitHub repository
        fetch('./final_pipeline.html.gz')
            .then(response => {
                if (!response.ok) throw new Error("Could not load compressed file.");
                return response.arrayBuffer();
            })
            .then(buffer => {
                // Decompress the binary data into plain HTML text
                const decompressed = pako.ungzip(new Uint8Array(buffer), { to: 'string' });
                
                // Hide the loader and inject the notebook contents
                document.getElementById('loading').style.display = 'none';
                
                const contentDiv = document.getElementById('content');
                contentDiv.innerHTML = decompressed;

                // Execute any embedded Jupyter javascript charting logic safely
                const scripts = contentDiv.getElementsByTagName('script');
                for (let i = 0; i < scripts.length; i++) {
                    const script = document.createElement('script');
                    if (scripts[i].src) {
                        script.src = scripts[i].src;
                    } else {
                        script.text = scripts[i].text;
                    }
                    document.head.appendChild(script).parentNode.removeChild(script);
                }
            })
            .catch(err => {
                document.getElementById('loading').innerHTML = " Error rendering notebook: " + err.message;
                console.error(err);
            });
    </script>
</body>
</html>
